<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1019">
  <meta name="description" content="Minecraft Java 1.8.9 resource-pack editor for textures, animation, 3D models and OptiFine sky.">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css">
  <title>MC Texture Maker</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark"><span></span><span></span><span></span><span></span></div><div><strong>MC Texture Maker</strong><small>Java 1.8.9 Studio</small></div></div>
    <nav class="workspace-tabs" aria-label="Workspaces"><button data-workspace="texture" class="active">Texture</button><button data-workspace="animate">Animate</button><button data-workspace="3d">3D</button><button data-workspace="sky">Sky</button><button data-workspace="advanced">Advanced</button></nav>
    <div class="top-actions"><span class="save-state" id="saveState" aria-live="polite">Starting…</span><button id="validateBtn" class="ghost">Validate <span id="problemBadge" class="count">0</span></button><button id="exportBtn" class="primary">Export ZIP</button></div>
  </header>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="project-card"><div class="project-row"><div><span class="eyebrow">PROJECT</span><h1 id="projectName">Untitled Pack</h1></div><button id="newBtn" class="icon-btn" title="New pack">＋</button></div><div class="project-meta"><span id="assetCount">0 files</span><div id="summaryChips" class="summary-chips"></div></div><div class="project-actions"><button id="importBtn" class="secondary">Import ZIP</button><button id="importPngBtn" class="secondary">PNG</button></div><input id="zipInput" type="file" accept=".zip,application/zip" hidden><input id="pngInput" type="file" accept="image/png" hidden></div>
      <div class="searchbox"><span>⌕</span><input id="assetSearch" placeholder="Search assets…"></div>
      <div class="filters" aria-label="Asset filters"><button data-filter="All" class="active">All</button><button data-filter="Blocks">Blocks</button><button data-filter="Items">Items</button><button data-filter="Entities">Entities</button><button data-filter="GUI">GUI</button><button data-filter="Sky">Sky</button><button data-filter="CTM">CTM</button><button data-filter="Models">Models</button></div>
      <div id="assetList" class="asset-list"></div>
    </aside>
    <section class="workspace-host">
      <div id="workspaceTexture" class="workspace"></div><div id="workspaceAnimate" class="workspace hidden"></div><div id="workspace3d" class="workspace hidden"></div><div id="workspaceSky" class="workspace hidden"></div><div id="workspaceAdvanced" class="workspace hidden"></div>
    </section>
  </main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="busyModal" class="busy hidden"><div class="busy-card"><div class="loader-cube"><i></i><i></i><i></i></div><h2 id="busyTitle">Working…</h2><p id="busySub"></p><div class="progress"><span id="busyBar"></span></div><code id="busyFile"></code></div></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
