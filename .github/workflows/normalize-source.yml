name: Normalize UI source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore normal source files
        run: |
          set -euo pipefail
          mkdir -p src /tmp/mctm-ui
          cat recovery-index/part0 recovery-index/part1 recovery-index/part2 recovery-index/part3 recovery-index/part4 recovery-index/part5 > /tmp/mctm-ui/index.b64
          base64 -d /tmp/mctm-ui/index.b64 | gzip -t
          base64 -d /tmp/mctm-ui/index.b64 | gzip -d > index.html
          base64 -d ui-source/styles.css.gz.b64 | gzip -d > styles.css
          base64 -d ui-source/app-part0.gz.b64 | gzip -d > /tmp/mctm-ui/app0.js
          base64 -d ui-source/app-part1.gz.b64 | gzip -d > /tmp/mctm-ui/app1.js
          cat /tmp/mctm-ui/app0.js /tmp/mctm-ui/app1.js > src/app.js
          sed -i "s/const CACHE='mctm-v2';/const CACHE='mctm-v3';/" sw.js
      - name: Verify restored source
        run: |
          set -euo pipefail
          for f in src/*.js sw.js; do node --check "$f"; done
          node tests/zip.test.mjs
          node tests/validators.test.mjs
          node tests/ui-static.test.mjs
          node tests/vanilla-baseline.test.mjs
      - name: Remove materialization layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml')
          lines=p.read_text().splitlines()
          out=[]
          skipping=False
          for line in lines:
              if line.strip() == '- name: Materialize verified UI':
                  skipping=True
                  continue
              if skipping and line.strip() == '- name: Mandatory UI skill gate':
                  skipping=False
                  out.append(line)
                  continue
              if not skipping:
                  out.append(line)
          p.write_text('\n'.join(out)+'\n')
          PY
          rm -rf ui-source recovery-index
          rm -f .github/workflows/recover-source.yml .github/workflows/normalize-source.yml
      - name: Commit normalized source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: normalize verified UI source"
          git push
