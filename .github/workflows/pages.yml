name: Test and deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mandatory UI skill gate
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const gate = JSON.parse(fs.readFileSync('quality/ui-skill-gate.json', 'utf8'));
          const failures = [];
          if (gate.requiredSkill !== 'ui-implementation-quality') failures.push('wrong required skill');
          if (gate.requiredVersion !== 'v0.2') failures.push('wrong required version');
          if (gate.applied !== true) failures.push('required skill not applied');
          if (gate.reviewPipeline !== 'PASS') failures.push('review pipeline not PASS');
          if (gate.runtimeQA !== 'PASS') failures.push('runtime QA not PASS');
          if (gate.regression !== 'PASS') failures.push('regression not PASS');
          if (gate.completionAllowed !== true) failures.push('completion not allowed');
          if (failures.length) {
            console.error('UI SKILL GATE FAILED:');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }
          console.log('UI SKILL GATE PASS');
          EOF
      - name: Syntax and core tests
        run: |
          for f in src/*.js src/editors/*.js sw.js; do node --check "$f"; done
          node tests/zip.test.mjs
          node tests/validators.test.mjs
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
