name: Test and deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize verified UI
        run: |
          mkdir -p src /tmp/mctm-ui
          base64 -d ui-source/index.html.gz.b64 | gzip -d > index.html
          sed 's/=$//' ui-source/styles.css.gz.b64 | base64 -d | gzip -d > styles.css
          base64 -d ui-source/app-part0.gz.b64 | gzip -d > /tmp/mctm-ui/app0.js
          base64 -d ui-source/app-part1.gz.b64 | gzip -d > /tmp/mctm-ui/app1.js
          cat /tmp/mctm-ui/app0.js /tmp/mctm-ui/app1.js > src/app.js
      - name: Mandatory UI skill gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gate=JSON.parse(fs.readFileSync('quality/ui-skill-gate.json','utf8'));
          const failures=[];
          if(gate.requiredSkill!=='ui-implementation-quality')failures.push('wrong required skill');
          if(gate.requiredVersion!=='v0.2')failures.push('wrong required version');
          if(gate.applied!==true)failures.push('required skill not applied');
          if(gate.reviewPipeline!=='PASS')failures.push('review pipeline not PASS');
          if(gate.runtimeQA!=='PASS')failures.push('runtime QA not PASS');
          if(gate.regression!=='PASS')failures.push('regression not PASS');
          if(gate.completionAllowed!==true)failures.push('completion not allowed');
          if(!gate.evidence||!fs.existsSync(gate.evidence))failures.push('verification evidence missing');
          if(failures.length){for(const f of failures)console.error(`- ${f}`);process.exit(1)}
          console.log('UI SKILL GATE PASS');
          NODE
      - name: Syntax and regression tests
        run: |
          for f in src/*.js sw.js; do node --check "$f"; done
          node tests/zip.test.mjs
          node tests/validators.test.mjs
          node tests/ui-static.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
