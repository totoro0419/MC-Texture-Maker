name: Recover source snapshot
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            ui-source
            README.md
            src
            tests
            quality
            .github/workflows/pages.yml
          if-no-files-found: error
